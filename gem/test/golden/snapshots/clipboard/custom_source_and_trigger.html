<div data-action="click@window-&gt;ruby-ui--clipboard#onClickOutside" data-controller="ruby-ui--clipboard" data-ruby-ui--clipboard-error-value="Falhou!" data-ruby-ui--clipboard-options-value="{}" data-ruby-ui--clipboard-success-value="Copiado!">
  <div>
    <div data-ruby-ui--clipboard-target="source">
      gem install ruby_ui
    </div>
    <div data-action="click-&gt;ruby-ui--clipboard#copy" data-ruby-ui--clipboard-target="trigger">
      <button class="whitespace-nowrap inline-flex items-center justify-center rounded-md font-medium transition-colors disabled:pointer-events-none disabled:opacity-50 focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring aria-disabled:pointer-events-none aria-disabled:opacity-50 aria-disabled:cursor-not-allowed h-9 w-9 bg-primary text-primary-foreground shadow hover:bg-primary/90" type="button">
        C
      </button>
    </div>
  </div>
  <div class="hidden" data-ruby-ui--clipboard-target="successPopover" style="width: max-content; position: absolute; top: 0; left: 0;">
    <div class="z-50 rounded-md text-sm border bg-background px-2 py-0.5 text-foreground shadow-md outline-none data-[state=open]:animate-in data-[state=closed]:animate-out data-[state=closed]:fade-out-0 data-[state=open]:fade-in-0 data-[state=closed]:zoom-out-95 data-[state=open]:zoom-in-95 data-[state=closed]:fill-mode-forwards data-[side=bottom]:slide-in-from-top-2 data-[side=left]:slide-in-from-right-2 data-[side=right]:slide-in-from-left-2 data-[side=top]:slide-in-from-bottom-2" data-ruby-ui--clipboard-target="successPanel" data-state="open">
      Copiado!
    </div>
  </div>
  <div class="hidden" data-ruby-ui--clipboard-target="errorPopover" style="width: max-content; position: absolute; top: 0; left: 0;">
    <div class="z-50 rounded-md text-sm border bg-background px-2 py-0.5 text-foreground shadow-md outline-none data-[state=open]:animate-in data-[state=closed]:animate-out data-[state=closed]:fade-out-0 data-[state=open]:fade-in-0 data-[state=closed]:zoom-out-95 data-[state=open]:zoom-in-95 data-[state=closed]:fill-mode-forwards data-[side=bottom]:slide-in-from-top-2 data-[side=left]:slide-in-from-right-2 data-[side=right]:slide-in-from-left-2 data-[side=top]:slide-in-from-bottom-2" data-ruby-ui--clipboard-target="errorPanel" data-state="open">
      Falhou!
    </div>
  </div>
</div>
