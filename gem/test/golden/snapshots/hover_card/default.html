<div data-controller="ruby-ui--hover-card" data-ruby-ui--hover-card-options-value="{&quot;delay&quot;:[500,250],&quot;trigger&quot;:&quot;mouseenter focus click&quot;}">
  <div class="inline-block" data-ruby-ui--hover-card-target="trigger">
    <button class="whitespace-nowrap inline-flex items-center justify-center rounded-md font-medium transition-colors disabled:pointer-events-none disabled:opacity-50 focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring aria-disabled:pointer-events-none aria-disabled:opacity-50 aria-disabled:cursor-not-allowed px-4 py-2 h-9 text-sm text-primary underline-offset-4 hover:underline" type="button">
      @joeldrapper
    </button>
  </div>
  <div class="hidden absolute z-50 rounded-md border bg-background p-4 text-foreground shadow-md outline-none data-[state=open]:animate-in data-[state=closed]:animate-out data-[state=closed]:fade-out-0 data-[state=open]:fade-in-0 data-[state=closed]:zoom-out-95 data-[state=open]:zoom-in-95 data-[state=closed]:fill-mode-forwards data-[side=bottom]:slide-in-from-top-2 data-[side=left]:slide-in-from-right-2 data-[side=right]:slide-in-from-left-2 data-[side=top]:slide-in-from-bottom-2" data-ruby-ui--hover-card-target="content" data-state="closed">
    <span class="relative flex shrink-0 overflow-hidden rounded-full h-10 w-10 text-base" data-controller="ruby-ui--avatar">
      <span class="flex h-full w-full items-center justify-center rounded-full bg-muted" data-ruby-ui--avatar-target="fallback">
        JD
      </span>
    </span>
  </div>
</div>
