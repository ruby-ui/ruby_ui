<div class="inline-block" data-controller="ruby-ui--alert-dialog" data-ruby-ui--alert-dialog-open-value="false">
  <div class="inline-block" data-action="click-&gt;ruby-ui--alert-dialog#open">
    <button class="whitespace-nowrap inline-flex items-center justify-center rounded-md font-medium transition-colors disabled:pointer-events-none disabled:opacity-50 focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring aria-disabled:pointer-events-none aria-disabled:opacity-50 aria-disabled:cursor-not-allowed px-4 py-2 h-9 text-sm bg-primary text-primary-foreground shadow hover:bg-primary/90" type="button">
      Show dialog
    </button>
  </div>
  <template data-ruby-ui--alert-dialog-target="content">
    <div data-controller="ruby-ui--alert-dialog">
      <div aria-hidden="true" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm data-[state=open]:animate-in" data-aria-hidden="true" data-state="open" style="pointer-events:auto"></div>
      <div class="flex flex-col fixed left-[50%] top-[50%] z-50 w-full max-w-lg max-h-screen overflow-y-auto translate-x-[-50%] translate-y-[-50%] gap-4 border bg-background p-6 shadow-lg duration-200 data-[state=open]:animate-in data-[state=open]:fade-in-0 data-[state=open]:zoom-in-95 sm:rounded-lg md:w-full" data-state="open" role="alertdialog" style="pointer-events:auto">
        <div class="flex flex-col space-y-2 text-center sm:text-left rtl:sm:text-right">
          <h2 class="text-lg font-semibold">
            Are you absolutely sure?
          </h2>
          <p class="text-sm text-muted-foreground">
            This action cannot be undone.
          </p>
        </div>
        <div class="flex flex-col-reverse sm:flex-row sm:justify-end sm:space-x-2 rtl:space-x-reverse">
          <button class="whitespace-nowrap inline-flex items-center justify-center rounded-md font-medium transition-colors disabled:pointer-events-none disabled:opacity-50 focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring aria-disabled:pointer-events-none aria-disabled:opacity-50 aria-disabled:cursor-not-allowed px-4 py-2 h-9 text-sm border border-input bg-background shadow-sm hover:bg-accent hover:text-accent-foreground mt-2 sm:mt-0" data-action="click-&gt;ruby-ui--alert-dialog#dismiss" type="button">
            Cancel
          </button>
          <button class="whitespace-nowrap inline-flex items-center justify-center rounded-md font-medium transition-colors disabled:pointer-events-none disabled:opacity-50 focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring aria-disabled:pointer-events-none aria-disabled:opacity-50 aria-disabled:cursor-not-allowed px-4 py-2 h-9 text-sm bg-primary text-primary-foreground shadow hover:bg-primary/90" type="button">
            Continue
          </button>
        </div>
      </div>
    </div>
  </template>
</div>
