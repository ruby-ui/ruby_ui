<div class="p-3 space-y-4" data-controller="ruby-ui--calendar" data-ruby-ui--calendar-format-value="yyyy-MM-dd">
  <div class="flex justify-center pt-1 relative items-center">
    <div aria-live="polite" class="text-sm font-medium" data-ruby-ui--calendar-target="title" role="presentation">
      Month Year
    </div>
    <button aria-label="Go to previous month" class="rdp-button_reset rdp-button inline-flex items-center justify-center rounded-md text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 border border-input hover:bg-accent hover:text-accent-foreground h-7 w-7 bg-transparent p-0 opacity-50 hover:opacity-100 absolute left-1" data-action="click-&gt;ruby-ui--calendar#prevMonth" name="previous-month" type="button">
      <svg class="h-4 w-4" fill="none" height="15" viewBox="0 0 15 15" width="15" xmlns:xmlns="http://www.w3.org/2000/svg">
        <path clip-rule="evenodd" d="M8.84182 3.13514C9.04327 3.32401 9.05348 3.64042 8.86462 3.84188L5.43521 7.49991L8.86462 11.1579C9.05348 11.3594 9.04327 11.6758 8.84182 11.8647C8.64036 12.0535 8.32394 12.0433 8.13508 11.8419L4.38508 7.84188C4.20477 7.64955 4.20477 7.35027 4.38508 7.15794L8.13508 3.15794C8.32394 2.95648 8.64036 2.94628 8.84182 3.13514Z" fill="currentColor" fill-rule="evenodd"></path>
      </svg>
    </button>
    <button aria-label="Go to next month" class="inline-flex items-center justify-center rounded-md text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 border border-input hover:bg-accent hover:text-accent-foreground h-7 w-7 bg-transparent p-0 opacity-50 hover:opacity-100 absolute right-1" data-action="click-&gt;ruby-ui--calendar#nextMonth" name="next-month" type="button">
      <svg class="h-4 w-4" fill="none" height="15" viewBox="0 0 15 15" width="15" xmlns:xmlns="http://www.w3.org/2000/svg">
        <path clip-rule="evenodd" d="M6.1584 3.13508C6.35985 2.94621 6.67627 2.95642 6.86514 3.15788L10.6151 7.15788C10.7954 7.3502 10.7954 7.64949 10.6151 7.84182L6.86514 11.8418C6.67627 12.0433 6.35985 12.0535 6.1584 11.8646C5.95694 11.6757 5.94673 11.3593 6.1356 11.1579L9.565 7.49985L6.1356 3.84182C5.94673 3.64036 5.95694 3.32394 6.1584 3.13508Z" fill="currentColor" fill-rule="evenodd"></path>
      </svg>
    </button>
  </div>
  <table data-ruby-ui--calendar-target="calendar"></table>
  <template data-ruby-ui--calendar-target="weekdaysTemplate">
    <thead>
      <tr class="flex">
        <th aria-label="Monday" class="text-muted-foreground rounded-md w-8 font-normal text-[0.8rem]" scope="col">
          Mo
        </th>
        <th aria-label="Tuesday" class="text-muted-foreground rounded-md w-8 font-normal text-[0.8rem]" scope="col">
          Tu
        </th>
        <th aria-label="Wednesday" class="text-muted-foreground rounded-md w-8 font-normal text-[0.8rem]" scope="col">
          We
        </th>
        <th aria-label="Thursday" class="text-muted-foreground rounded-md w-8 font-normal text-[0.8rem]" scope="col">
          Th
        </th>
        <th aria-label="Friday" class="text-muted-foreground rounded-md w-8 font-normal text-[0.8rem]" scope="col">
          Fr
        </th>
        <th aria-label="Saturday" class="text-muted-foreground rounded-md w-8 font-normal text-[0.8rem]" scope="col">
          Sa
        </th>
        <th aria-label="Sunday" class="text-muted-foreground rounded-md w-8 font-normal text-[0.8rem]" scope="col">
          Su
        </th>
      </tr>
    </thead>
  </template>
  <template data-ruby-ui--calendar-target="disabledDateTemplate">
    <td class="relative p-0 text-center text-sm focus-within:relative focus-within:z-20 [&amp;:has([aria-selected])]:bg-accent [&amp;:has([aria-selected])]:rounded-md" role="presentation">
      <button aria-disabled="true" class="inline-flex items-center justify-center rounded-md text-sm ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 h-8 w-8 p-0 font-normal aria-selected:opacity-100 cursor-not-allowed bg-background text-muted-foreground hover:bg-background hover:text-muted-foreground" data-day="{{day}}" disabled name="day" role="gridcell" tabindex="-1" type="button">
        {{dayDate}}
      </button>
    </td>
  </template>
  <template data-ruby-ui--calendar-target="selectedDateTemplate">
    <td class="relative p-0 text-center text-sm focus-within:relative focus-within:z-20 [&amp;:has([aria-selected])]:bg-accent [&amp;:has([aria-selected])]:rounded-md" role="presentation">
      <button aria-selected="true" class="inline-flex items-center justify-center rounded-md text-sm ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 h-8 w-8 p-0 font-normal aria-selected:opacity-100 bg-primary text-primary-foreground hover:bg-primary hover:text-primary-foreground focus:bg-primary focus:text-primary-foreground" data-action="click-&gt;ruby-ui--calendar#selectDay" data-day="{{day}}" name="day" role="gridcell" tabindex="0" type="button">
        {{dayDate}}
      </button>
    </td>
  </template>
  <template data-ruby-ui--calendar-target="todayDateTemplate">
    <td class="relative p-0 text-center text-sm focus-within:relative focus-within:z-20 [&amp;:has([aria-selected])]:bg-accent [&amp;:has([aria-selected])]:rounded-md" role="presentation">
      <button class="inline-flex items-center justify-center rounded-md text-sm ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 h-8 w-8 p-0 font-normal aria-selected:opacity-100 bg-accent text-accent-foreground hover:bg-accent hover:text-accent-foreground focus:bg-accent focus:text-accent-foreground" data-action="click-&gt;ruby-ui--calendar#selectDay" data-day="{{day}}" name="day" role="gridcell" tabindex="-1" type="button">
        {{dayDate}}
      </button>
    </td>
  </template>
  <template data-ruby-ui--calendar-target="currentMonthDateTemplate">
    <td class="relative p-0 text-center text-sm focus-within:relative focus-within:z-20 [&amp;:has([aria-selected])]:bg-accent [&amp;:has([aria-selected])]:rounded-md" role="presentation">
      <button class="inline-flex items-center justify-center rounded-md text-sm ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 h-8 w-8 p-0 font-normal aria-selected:opacity-100 bg-background text-foreground hover:bg-accent hover:text-accent-foreground focus:bg-accent focus:text-accent-foreground" data-action="click-&gt;ruby-ui--calendar#selectDay" data-day="{{day}}" name="day" role="gridcell" tabindex="-1" type="button">
        {{dayDate}}
      </button>
    </td>
  </template>
  <template data-ruby-ui--calendar-target="otherMonthDateTemplate">
    <td class="relative p-0 text-center text-sm focus-within:relative focus-within:z-20 [&amp;:has([aria-selected])]:bg-accent [&amp;:has([aria-selected])]:rounded-md" role="presentation">
      <button class="inline-flex items-center justify-center rounded-md text-sm ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 h-8 w-8 p-0 font-normal aria-selected:opacity-100 bg-background text-muted-foreground hover:bg-accent hover:text-accent-foreground focus:bg-accent focus:text-accent-foreground" data-action="click-&gt;ruby-ui--calendar#selectDay" data-day="{{day}}" name="day" role="gridcell" tabindex="-1" type="button">
        {{dayDate}}
      </button>
    </td>
  </template>
</div>
