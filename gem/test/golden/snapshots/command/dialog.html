<div data-controller="ruby-ui--command-dialog" data-ruby-ui--command-dialog-ruby-ui--command-outlet="[data-ruby-ui--command-dialog-instance]">

            <svg class="w-4 h-4 mr-1.5" fill="currentColor" viewBox="0 0 20 20" xmlns:xmlns="http://www.w3.org/2000/svg">

            <input aria-autocomplete="list" aria-expanded="" autocomplete="off" autocorrect="off" autofocus class="flex h-10 w-full rounded-md bg-transparent py-3 text-sm outline-none placeholder:text-muted-foreground disabled:cursor-not-allowed disabled:opacity-50" data-action="input-&gt;ruby-ui--command#filter keydown.down-&gt;ruby-ui--command#handleKeydown keydown.up-&gt;ruby-ui--command#handleKeydown keydown.enter-&gt;ruby-ui--command#handleKeydown keydown.esc-&gt;ruby-ui--command#dismiss" data-ruby-ui--command-target="input" placeholder="Type a command or search..." role="combobox" value="">

          <div class="py-6 text-center text-sm" data-ruby-ui--command-target="empty" role="presentation">
            No results found.
          </div>
          <div class="divide-y divide-border">
            <div class="overflow-hidden p-1 text-foreground [&amp;_[group-heading]]:px-2 [&amp;_[group-heading]]:py-1.5 [&amp;_[group-heading]]:text-xs [&amp;_[group-heading]]:font-medium [&amp;_[group-heading]]:text-muted-foreground" data-ruby-ui--command-target="group" data-value="Components" role="presentation">

                  Alert

    </div>
