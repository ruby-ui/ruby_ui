# Intentional RubyUI-vs-shadcn differences. A divergence listed here makes the
# matching finding a `pass` with basis `intentional`.
# Optional `match: {part, property (Look) | attribute (ARIA, or `snapshot`), rubyui, shadcn}` lets `collect` apply it
# automatically; entries without it are applied by the agent.
- component: dialog
  dimension: HTML
  rubyui: "<dialog> + showModal()"
  shadcn: "<div role=\"dialog\">"
  reason: "Native modal dialog: the browser provides inert, Esc and focus handling."
  since: "2026-10-26"
- component: dialog
  dimension: HTML
  rubyui: "DialogTrigger <div> wrapping its child; ARIA set on the first interactive descendant"
  shadcn: "trigger is the <button> itself (render prop)"
  reason: "Phlex has no render prop and callers pass non-button children; the wrapper only carries the Stimulus action."
  since: "2026-10-29"
- component: alert_dialog
  dimension: HTML
  rubyui: "<dialog role=\"alertdialog\"> + showModal(); overlay is its ::backdrop"
  shadcn: "<div role=\"alertdialog\"> + separate overlay <div> in a portal"
  reason: "Native modal dialog: the browser provides inert, Esc, focus trap and focus return. Same approach as Dialog."
  since: "2026-11-01"
- component: alert_dialog
  dimension: HTML
  rubyui: "AlertDialogTrigger <div> wrapping its child; ARIA set on the first interactive descendant"
  shadcn: "trigger is the <button> itself (render prop)"
  reason: "Same as Dialog: Phlex has no render prop and callers pass non-button children; the wrapper only carries the Stimulus action."
  since: "2026-11-01"
- component: alert_dialog
  dimension: HTML
  rubyui: "AlertDialog root <div class=\"contents\"> carrying the Stimulus controller"
  shadcn: "Root renders no element"
  reason: "Stimulus needs an element that scopes the trigger and the dialog; display: contents keeps it out of layout."
  since: "2026-11-01"
- component: alert_dialog
  dimension: ARIA
  rubyui: "trigger aria-controls points at the <dialog> while closed too"
  shadcn: "trigger aria-controls only while open (the popup is unmounted when closed)"
  reason: "The <dialog> stays in the DOM when closed, so the id always resolves; same as Dialog."
  since: "2026-11-01"
- component: alert_dialog
  dimension: ARIA
  rubyui: "popup exposed as modal (showModal(); page behind is inert)"
  shadcn: "no aria-modal; Base UI sets aria-hidden on the page behind"
  reason: "showModal() makes the dialog modal natively and inerts the page behind it, which hides that content from the accessibility tree the same way shadcn's aria-hidden does."
  since: "2026-11-01"
- component: form
  dimension: Behavior
  rubyui: "FormField controller validates on the client: shows the browser validationMessage (or data-* custom messages) in FormFieldError on submit and updates it as the user types"
  shadcn: "No validation in Field; FieldError renders whatever the app passes (react-hook-form / TanStack Form)"
  reason: "Rails apps have no client form library; native Constraint Validation keeps parity without one."
  since: "2026-10-31"
- component: form
  dimension: HTML
  rubyui: "FormFieldError always renders its div role=alert, empty and hidden by empty:hidden when there is no error"
  shadcn: "FieldError returns null when it has no children and no errors"
  reason: "The FormField Stimulus controller writes client-side validation messages into that div, so it must exist before the first error."
  since: "2026-11-01"
- component: accordion
  dimension: HTML
  rubyui: "<details name> > <summary> > <h3> + chevrons; panel is the rest of the <details>"
  shadcn: "div > h3 > button[aria-expanded] + div[role=region] (Base UI Accordion)"
  reason: "Native disclosure: the browser handles open/close, the single-open group (name), keyboard and find-in-page. A heading inside <summary> is the allowed way to keep the heading outline."
  since: "2026-11-01"
- component: accordion
  dimension: ARIA
  rubyui: "panel without role=region / aria-labelledby; expanded state and the summary-to-content relation come from <details>"
  shadcn: "panel role=region aria-labelledby=trigger; trigger aria-expanded + aria-controls (only while open)"
  reason: "APG makes the region optional and advises against it when many panels can be open; <details> exposes the expanded state natively."
  since: "2026-11-01"
- component: accordion
  dimension: Props
  rubyui: "AccordionItem open: (initial state per item); no orientation, no value"
  shadcn: "Accordion.Root defaultValue / orientation, Accordion.Item value"
  reason: "Server-rendered Phlex has no controlled state, so open state lives on each item; orientation only drives arrow-key navigation, which Base UI 1.9 Accordion doesn't implement."
  since: "2026-11-01"
- component: accordion
  dimension: Look
  rubyui: "trigger cursor-pointer"
  shadcn: "trigger cursor: default"
  reason: "A <summary> without its disclosure marker gives no other hint that it's clickable."
  since: "2026-11-01"
