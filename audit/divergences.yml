# Intentional RubyUI-vs-shadcn differences. A divergence listed here makes the
# matching finding a `pass` with basis `intentional`.
- component: dialog
  dimension: HTML
  rubyui: "<dialog> + showModal()"
  shadcn: "<div role=\"dialog\">"
  reason: "Native modal dialog: the browser provides inert, Esc and focus handling."
  since: "2026-10-26"
