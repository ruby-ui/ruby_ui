# One input per state: phone with placeholder (data-audit-trigger, used for
# focus), phone with an already-masked value, CPF/CNPJ dynamic mask with an
# already-masked value, disabled and invalid (aria-invalid). Both sides get the
# same masked strings; maska keeps a value that already fits the mask. Every
# audited input carries data-audit-input.
phone: Phone
phone_placeholder: (11) 98765-4321
phone_filled: Phone (filled)
phone_value: (11) 98765-4321
document: CPF / CNPJ
document_value: 12.345.678/0001-90
disabled: Disabled
disabled_placeholder: Disabled input
invalid: Invalid
invalid_placeholder: Invalid input
