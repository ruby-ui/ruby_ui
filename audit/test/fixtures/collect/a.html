<!doctype html>
<html>
<body style="margin:0" data-audit-fixture="a">
  <button data-audit-trigger aria-expanded="false" aria-controls="p">Open</button>
  <div id="p" class="part" hidden style="padding-top:8px">Panel</div>
  <script>
    const b = document.querySelector("button"), p = document.getElementById("p")
    const set = (open) => { p.hidden = !open; b.setAttribute("aria-expanded", String(open)) }
    b.addEventListener("click", () => set(p.hidden))
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") set(false) })
  </script>
</body>
</html>
