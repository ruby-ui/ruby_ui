# RubyUI folder => shadcn counterpart (apps/v4/registry/bases/base/ui/<shadcn>.tsx).
# parts: RubyUI class => shadcn data-slot (null = no shadcn part).
# props: RubyUI class => {shadcn prop => RubyUI kwarg (null = none)}; shadcn props only.
# rubyui_only: RubyUI class => [kwargs with no shadcn counterpart]. className is never listed (all parts take class via attrs).
# selectors: RubyUI class => CSS selector of that part in the rendered fixture (fixed, so collect is deterministic);
#   null = not compared (shadcn renders no element for it, e.g. a Base UI root).
# fixture_shadcn: other shadcn components the fixture renders (added to the sandbox, not audited here).
dialog:
  shadcn: dialog
  kind: modal
  docs_view: dialog
  parts:
    Dialog: dialog
    DialogTrigger: dialog-trigger
    DialogContent: dialog-content
    DialogHeader: dialog-header
    DialogFooter: dialog-footer
    DialogTitle: dialog-title
    DialogDescription: dialog-description
    DialogMiddle: null
  selectors:
    Dialog: null
    DialogTrigger: '[data-ruby-ui--dialog-target="trigger"] > button'
    DialogContent: 'dialog[data-ruby-ui--dialog-target="dialog"]'
    DialogHeader: 'dialog[data-ruby-ui--dialog-target="dialog"] > div:first-child'
    DialogFooter: 'dialog[data-ruby-ui--dialog-target="dialog"] > div:last-of-type'
    DialogTitle: '[data-ruby-ui--dialog-target="title"]'
    DialogDescription: '[data-ruby-ui--dialog-target="description"]'
  props:
    Dialog: {open: open}
    DialogContent: {showCloseButton: show_close_button}
    DialogFooter: {showCloseButton: show_close_button}
  rubyui_only:
    DialogContent: [size]

alert_dialog:
  shadcn: alert-dialog
  kind: modal
  docs_view: alert_dialog
  parts:
    AlertDialog: alert-dialog
    AlertDialogTrigger: alert-dialog-trigger
    AlertDialogContent: alert-dialog-content
    AlertDialogHeader: alert-dialog-header
    AlertDialogFooter: alert-dialog-footer
    AlertDialogTitle: alert-dialog-title
    AlertDialogDescription: alert-dialog-description
    AlertDialogAction: alert-dialog-action
    AlertDialogCancel: alert-dialog-cancel
  selectors:
    AlertDialog: null
    AlertDialogTrigger: '[data-controller="ruby-ui--alert-dialog"] > [data-action] > button'
    AlertDialogContent: '[role="alertdialog"]'
    AlertDialogHeader: '[role="alertdialog"] > div:first-child'
    AlertDialogFooter: '[role="alertdialog"] > div:last-child'
    AlertDialogTitle: '[role="alertdialog"] > div:first-child > h2'
    AlertDialogDescription: '[role="alertdialog"] > div:first-child > p'
    AlertDialogAction: '[role="alertdialog"] > div:last-child > button:last-child'
    AlertDialogCancel: '[role="alertdialog"] > div:last-child > button:first-child'
  props:
    AlertDialogContent: {size: null}
    AlertDialogCancel: {variant: variant, size: size}

sheet:
  shadcn: sheet
  kind: modal
  docs_view: sheet
  parts:
    Sheet: sheet
    SheetTrigger: sheet-trigger
    SheetContent: sheet-content
    SheetHeader: sheet-header
    SheetFooter: sheet-footer
    SheetTitle: sheet-title
    SheetDescription: sheet-description
    SheetMiddle: null
  selectors:
    Sheet: null
    SheetTrigger: '[data-controller="ruby-ui--sheet"] > [data-action] > button'
    SheetContent: '[data-ruby-ui--sheet-content-target="panel"]'
    SheetHeader: '[data-ruby-ui--sheet-content-target="panel"] > div:first-child'
    SheetFooter: '[data-ruby-ui--sheet-content-target="panel"] > div:last-of-type'
    SheetTitle: '[data-ruby-ui--sheet-content-target="panel"] > div:first-child > h3'
    SheetDescription: '[data-ruby-ui--sheet-content-target="panel"] > div:first-child > p'
  props:
    SheetContent: {side: side, showCloseButton: null}

command:
  shadcn: command
  kind: popover
  docs_view: command
  parts:
    Command: command
    CommandInput: command-input
    CommandList: command-list
    CommandEmpty: command-empty
    CommandGroup: command-group
    CommandItem: command-item
    CommandDialog: dialog
    CommandDialogTrigger: null
    CommandDialogContent: dialog-content
  selectors:
    Command: '[data-ruby-ui--command-target="panel"] > div'
    CommandInput: 'input[data-ruby-ui--command-target="input"]'
    CommandList: '[data-ruby-ui--command-target="panel"] > div > div:has([data-ruby-ui--command-target="group"])'
    CommandEmpty: '[data-ruby-ui--command-target="empty"]'
    CommandGroup: '[data-ruby-ui--command-target="group"]'
    CommandItem: '[data-ruby-ui--command-target="item"]'
    CommandDialog: null
    CommandDialogContent: '[data-ruby-ui--command-target="panel"]'
  props:
    CommandInput: {placeholder: placeholder}
    CommandGroup: {heading: title}
    CommandItem: {value: value}
    CommandDialog: {title: null, description: null, showCloseButton: null}
  rubyui_only:
    CommandItem: [text, href]
    CommandDialogContent: [size]
    CommandDialogTrigger: [keybindings]

form:
  shadcn: field
  kind: form_control
  docs_view: form
  parts:
    Form: null
    FormField: field
    FormFieldLabel: field-label
    FormFieldHint: field-description
    FormFieldError: field-error
    FormFieldSet: field-set
    FormFieldLegend: field-legend
    FormFieldGroup: field-group
    FormFieldContent: field-content
    FormFieldTitle: field-label
    FormFieldSeparator: field-separator
  selectors:
    FormField: '[data-slot="field"]'
    FormFieldLabel: '[data-slot="field-label"]'
    FormFieldHint: '[data-slot="field-description"]'
    FormFieldError: '[data-slot="field-error"]'
    FormFieldSet: '[data-slot="field-set"]'
    FormFieldLegend: '[data-slot="field-legend"]'
    FormFieldGroup: '[data-slot="field-group"]'
    FormFieldContent: '[data-slot="field-content"]'
    FormFieldTitle: null
    FormFieldSeparator: '[data-slot="field-separator"]'
  props:
    FormField: {orientation: orientation}
    FormFieldLegend: {variant: variant}
    FormFieldError: {errors: errors}
  fixture_shadcn: [button, input, checkbox]

accordion:
  shadcn: accordion
  kind: disclosure
  docs_view: accordion
  parts:
    Accordion: accordion
    AccordionItem: accordion-item
    AccordionTrigger: accordion-trigger
    AccordionIcon: accordion-trigger-icon
    AccordionContent: accordion-content
  selectors:
    Accordion: '[data-slot="accordion"]'
    AccordionItem: '[data-slot="accordion-item"]'
    AccordionTrigger: '[data-slot="accordion-trigger"]'
    AccordionIcon: '[data-slot="accordion-trigger-icon"]'
    AccordionContent: '[data-slot="accordion-content"]'
  props:
    Accordion: {multiple: multiple, disabled: disabled, defaultValue: null, orientation: null}
    AccordionItem: {value: null, disabled: disabled}
  rubyui_only:
    AccordionItem: [open]
    AccordionTrigger: [level, icon]

alert:
  shadcn: alert
  kind: static
  docs_view: alert
  parts:
    Alert: alert
    AlertTitle: alert-title
    AlertDescription: alert-description
    AlertAction: alert-action
  selectors:
    Alert: '[data-slot="alert"]'
    AlertTitle: '[data-slot="alert-title"]'
    AlertDescription: '[data-slot="alert-description"]'
    AlertAction: '[data-slot="alert-action"]'
  props:
    Alert: {variant: variant}
