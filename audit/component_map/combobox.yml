shadcn: combobox
kind: popover
docs_view: combobox
# The fixture follows shadcn's "Combobox in Popup" example: a Button trigger
# with the value, the search input inside the popup, one labelled group.
parts:
  Combobox: null
  ComboboxTrigger: combobox-trigger
  ComboboxValue: combobox-value
  ComboboxInput: input-group-control
  ComboboxContent: combobox-content
  ComboboxList: combobox-list
  ComboboxEmpty: combobox-empty
  ComboboxGroup: combobox-group
  ComboboxLabel: combobox-label
  ComboboxSeparator: combobox-separator
  ComboboxItem: combobox-item
  ComboboxChips: combobox-chips
  ComboboxChip: combobox-chip
  ComboboxChipsInput: combobox-chip-input
  ComboboxToggleAll: null
  ComboboxContext: null
selectors:
  ComboboxTrigger: 'button[data-ruby-ui--combobox-target="trigger"]'
  ComboboxValue: null
  ComboboxInput: '[data-slot="input-group-control"]'
  ComboboxContent: '[data-slot="combobox-content"]'
  ComboboxList: '[data-slot="combobox-list"]'
  ComboboxEmpty: '[data-slot="combobox-empty"]'
  ComboboxGroup: '[data-slot="combobox-group"]'
  ComboboxLabel: '[data-slot="combobox-label"]'
  ComboboxItem: '[data-slot="combobox-item"]'
  ComboboxSeparator: null
  ComboboxChips: null
  ComboboxChip: null
  ComboboxChipsInput: null
props:
  ComboboxContent: {side: side, sideOffset: side_offset, align: align, alignOffset: align_offset, anchor: null}
  ComboboxInput: {disabled: disabled, showTrigger: show_trigger, showClear: show_clear}
  ComboboxChip: {showRemove: null}
rubyui_only:
  Combobox: [name, multiple, term, disabled, required]
  ComboboxValue: [placeholder]
  ComboboxItem: [value, selected, disabled, text, input]
  ComboboxChips: [show_remove]
  ComboboxChipsInput: [placeholder, disabled]
fixture_shadcn: [button]
